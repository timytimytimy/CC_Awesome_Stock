themes:
  - slug: ai-infrastructure
    name_zh: AI 算力与基础设施
    industries: [电子, 通信, 计算机]
    supply_chain:
      upstream: [GPU芯片, HBM内存, 光模块, 液冷散热]
      midstream: [服务器, 交换机, IDC数据中心]
      downstream: [云计算, AI应用, 大模型厂商]
    typical_stocks: ["300308.SZ", "300454.SZ", "002049.SZ"]
