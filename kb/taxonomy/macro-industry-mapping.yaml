# ── 维护说明 ────────────────────────────────────────────────
maintenance:
  - 信用周期象限由 macro.classify_credit_cycle() 的 phase 前两字决定。
  - 未在 favored/penalized 列出的行业 → 调整分 0（中性）。
  - 政策催化（policy）不在本表——按 P0.4 设计原则，政策影响交给分析阶段
    的 LLM/subagent 判断（decision-tree 阶段 1/2 读 _recent.md），不硬编码进选股脚本。
  - 每季度复核：象限切换后，favored 行业是否真的跑赢。
