# ════════════════════════════════════════════════════════════════
# 宏观状态 → 行业加减分映射 (macro-industry-mapping)
# ────────────────────────────────────────────────────────────────
# 作用：把阶段 1 的宏观结论（信用周期 + PPI 方向）转成对个股得分的
#       加减项，让选股从"纯自下而上扫描"变成"自上而下预测 + 自下而上验证"。
#
# 使用方式（screen_all_market.py）：
#   1. 调 macro.classify_credit_cycle() 得到信用周期象限（复苏/过热/滞胀/衰退）
#   2. 个股 → 申万一级行业，查下表得到 macro_fit 调整分
#   3. macro_fit 计入个股综合得分（与估值/趋势/财务因子并列）
#
# 行业名必须对齐申万一级行业标准名。
# 分值范围约 ±6，相对单因子（趋势 +12 / 估值分位 ±18）是中等权重——
# 宏观是"加减项"，不喧宾夺主，但足以让顺风行业的好公司排名前移。
# ════════════════════════════════════════════════════════════════

version: 1
last_updated: 2026-05-21

# ── 信用周期四象限 → 行业调整（高善文框架）──────────────────────
# favored: 该象限顺风行业（正分）；penalized: 逆风行业（负分）
credit_cycle:
  复苏:
    note: 信用扩张初期，成长/制造占优，周期可逐步介入
    favored: {电子: 6, 计算机: 6, 电力设备: 5, 机械设备: 5, 汽车: 4, 国防军工: 3, 传媒: 3}
    penalized: {公用事业: -3, 银行: -2, 食品饮料: -2}
  过热:
    note: 通胀上行，周期/资源占优，警惕高估值成长被杀估值
    favored: {有色金属: 6, 石油石化: 6, 煤炭: 5, 基础化工: 4, 钢铁: 4, 银行: 2}
    penalized: {电子: -4, 计算机: -4, 电力设备: -3, 医药生物: -2, 传媒: -2}
  滞胀:
    note: 经济收缩+通胀仍高，防御为主：高股息/必需消费/资源
    favored: {食品饮料: 5, 公用事业: 5, 煤炭: 4, 石油石化: 3, 银行: 3, 农林牧渔: 3}
    penalized: {电子: -5, 计算机: -5, 房地产: -4, 汽车: -3, 机械设备: -3, 社会服务: -3}
  衰退:
    note: 通缩压力，现金流稳定/高股息防御，周期最差
    favored: {银行: 4, 公用事业: 5, 食品饮料: 4, 医药生物: 3, 交通运输: 2}
    penalized: {有色金属: -5, 钢铁: -5, 煤炭: -4, 基础化工: -4, 房地产: -3, 机械设备: -3}

# ── PPI 方向 → 上游资源行业额外微调（叠加在信用周期之上）────────
ppi_direction:
  上行: {有色金属: 3, 煤炭: 3, 石油石化: 3, 基础化工: 2, 钢铁: 2}
  下行: {有色金属: -3, 煤炭: -3, 石油石化: -2, 基础化工: -2, 钢铁: -2}

