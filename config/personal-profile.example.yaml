# ════════════════════════════════════════════════════════════
# 个人投资档案 (personal-profile)
# ════════════════════════════════════════════════════════════
# 这是整个选股系统的"根输入"。每一份分析报告都必须先读取本文件，
# 再据此计算仓位、过滤候选、设定止损、换算真实收益。
#
# 用法：
#   1. 复制本文件为 config/personal-profile.yaml
#   2. 填写你的真实信息
#   （personal-profile.yaml 不进 git，含个人隐私）
# ════════════════════════════════════════════════════════════

# ── 资金 ──────────────────────────────────────────────
capital:
  total: 300000            # 总可投资金（元）
  available: 200000        # 当前可用现金（未投入部分）

# ── 风险偏好 ──────────────────────────────────────────
risk:
  tolerance: medium        # low（保守）/ medium（平衡）/ high（激进）
  max_drawdown_tolerance: 20   # 能承受的账户最大回撤（%）
  stop_loss_mid: -12       # 中线持仓默认止损线（%）
  stop_loss_swing: -8      # 波段持仓默认止损线（%）

# ── 仓位硬规则（系统强制不得突破）──────────────────────
position_rules:
  max_single_stock_pct: 15       # 单只股票最大仓位（占总资金 %）
  max_single_industry_pct: 30    # 单个行业最大仓位（%）
  min_cash_reserve_pct: 20       # 任何时候保留的最低现金比例（%）
  max_positions: 8               # 最多同时持有几只股票
  min_order_amount: 5000         # 单笔最小下单金额（低于此值不值得操作）

# ── 时间与精力 ────────────────────────────────────────
capacity:
  daily_watch_minutes: 30    # 每天能投入盯盘/研究的分钟数
  can_watch_intraday: false  # 能否在交易时段实时盯盘
  trading_style: mid         # short（短线）/ swing（波段）/ mid（中线）/ long（长线）

# ── 禁区（明确不碰的）────────────────────────────────
exclusions:
  industries: []             # 不碰的行业，如 [军工, 房地产]
  types:                     # 不碰的股票类型
    - ST
    - 退市风险股
    - 北交所
  tickers: []                # 个股黑名单，如 [002XXX.SZ]

# ── 交易成本（用于换算真实收益）──────────────────────
costs:
  commission_rate: 0.00025   # 券商佣金率（双向收取）
  commission_min: 5          # 单笔最低佣金（元）
  stamp_tax_rate: 0.0005     # 印花税（仅卖出收取）
  transfer_fee_rate: 0.00001 # 过户费（双向）

# ── 元信息 ────────────────────────────────────────────
meta:
  owner: ""                  # 你的名字或代号
  created: 2026-05-21
  last_updated: 2026-05-21
