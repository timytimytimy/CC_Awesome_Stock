# ════════════════════════════════════════════════════════════
# 能力圈地图 (circle-of-competence)
# ════════════════════════════════════════════════════════════
# 对齐巴菲特/段永平核心原则：能力圈外的不碰。
#
# 评分 0-4：
#   0 = 完全不懂
#   1 = 只懂概念，说不清它怎么赚钱
#   2 = 懂基本商业模式和财报
#   3 = 深入研究过，跟踪过多家公司
#   4 = 长期跟踪 + 有实战经验，能判断行业拐点
#
# 决策门槛（系统强制）：
#   - A 档（强观察）只允许 level >= 3 的行业
#   - level <= 1 的行业，候选股需要更高置信度才能进 B 档
#   - level = 0 的行业，候选股最高 C 档（跟踪事件）
#
# 用法：复制本文件为 config/circle-of-competence.yaml 并按实际情况打分。
# ════════════════════════════════════════════════════════════

