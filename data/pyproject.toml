[project]
name = "stock-data"
version = "0.1.0"
description = "A股数据获取层 — akshare为主，CLI输出结构化Markdown供skill消费"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14",
    "pandas>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["../tests/data"]
